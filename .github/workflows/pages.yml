# Сборка сайта из публичной ленты t.me/s/crypto_news_ca и выкладка на GitHub Pages.
# Раз в 30 минут + вручную (Actions → pages → Run workflow) + на каждый push.
# Секретов нет: всё, что читает сборка, и так публично.
#
# Домен: Settings → Secrets and variables → Actions → Variables:
#   SITE_URL = https://example.com   (без домена — адрес GitHub Pages ниже)
#   CNAME    = example.com
name: pages

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      # Скачанные картинки между запусками: имя файла = хэш URL, замена обложки
      # в канале даёт новый URL и новую картинку.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: img-${{ github.run_id }}
          restore-keys: img-
      - name: Сборка
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://asagynbaev.github.io/crypto-news-ca-site' }}
          CNAME: ${{ vars.CNAME }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
